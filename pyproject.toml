[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis_env"
version = "0.1.0"
description = "Jarvis Virtual Assistant RL Environment"
requires-python = ">=3.10"
dependencies = [
    "pyyaml==6.0.1",
    "flask==3.0.0",
    "openenv-core==0.2.3"
]
